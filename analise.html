<style>

  /* =========================================================
     CARD RESPONSIVO DE ANÁLISES
     Fechado: fica encaixado no painel de ferramentas.
     Aberto: mostra a análise em um painel amplo sobre a página.
     ========================================================= */

  /* CARD FECHADO DE ANÁLISES */

  .aba_analises {
    position: relative;
    left: auto;
    right: auto;
    bottom: auto;

    width: 100%;
    height: auto;
    min-height: clamp(110px, 16vh, 165px);

    background:
      linear-gradient(145deg, rgba(192,132,252,0.14), rgba(10,20,40,0.96) 58%),
      rgba(10,20,40,0.98);

    color: white;

    border: 1px solid rgba(192,132,252,0.34);
    border-radius: 18px;

    overflow: hidden;

    z-index: 1;

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.035),
      0 10px 28px rgba(0,0,0,0.16);

    transition:
      border-color 0.22s ease,
      box-shadow 0.22s ease,
      transform 0.22s ease,
      background 0.22s ease;
  }

  .aba_analises:not(.aberta):hover {
    transform: translateY(-2px);
    border-color: rgba(192,132,252,0.58);

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.045),
      0 14px 34px rgba(0,0,0,0.24),
      0 0 0 1px rgba(192,132,252,0.05);
  }

  /* PAINEL ABERTO DE ANÁLISES */

  .aba_analises.aberta {
    position: fixed;

    left: 18px;
    right: 18px;
    top: 18px;
    bottom: 18px;

    width: auto;
    height: auto;
    min-height: 0;

    background:
      linear-gradient(145deg, rgba(21,39,70,0.98), rgba(7,18,38,0.995));

    border: 1px solid rgba(192,132,252,0.48);
    border-radius: 24px;

    overflow: hidden;

    z-index: 7000;

    transform: none;

    box-shadow:
      0 0 0 100vmax rgba(2,7,18,0.76),
      0 28px 80px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* CABEÇALHO DO CARD */

  .cabecalho_analises {
    min-height: clamp(110px, 16vh, 165px);

    padding: 16px 18px;

    cursor: pointer;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    gap: 9px;

    text-align: center;

    background:
      radial-gradient(
        circle at 50% 15%,
        rgba(192,132,252,0.16),
        transparent 48%
      );

    transition:
      background 0.22s ease,
      min-height 0.22s ease;
  }

  .cabecalho_analises::before {
    content: "✦";

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    color: #e7d6ff;

    font-size: 25px;
    line-height: 1;

    background: rgba(192,132,252,0.13);
    border: 1px solid rgba(192,132,252,0.38);

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.05),
      0 8px 18px rgba(0,0,0,0.16);
  }

  .cabecalho_analises strong {
    font-size: 15px;
    line-height: 1.2;
  }

  #iconeAnalises {
    font-size: 12px;
    color: rgba(255,255,255,0.72);

    padding: 6px 10px;

    border-radius: 999px;

    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.07);
  }

  .aba_analises:not(.aberta) .cabecalho_analises:hover {
    background:
      radial-gradient(
        circle at 50% 15%,
        rgba(192,132,252,0.24),
        transparent 52%
      );
  }

  /* CABEÇALHO QUANDO A ANÁLISE ESTÁ ABERTA */

  .aba_analises.aberta .cabecalho_analises {
    min-height: 58px;
    height: 58px;

    padding: 0 20px;

    flex-direction: row;
    justify-content: space-between;
    align-items: center;

    text-align: left;

    background: rgba(192,132,252,0.10);

    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .aba_analises.aberta .cabecalho_analises::before {
    display: none;
  }

  .aba_analises.aberta .cabecalho_analises strong {
    font-size: 17px;
  }

  .aba_analises.aberta #iconeAnalises {
    color: white;

    background: rgba(192,132,252,0.16);
    border-color: rgba(192,132,252,0.28);
  }

  /* CONTEÚDO INTERNO DAS ANÁLISES */

  .conteudo_analises {
    display: none;
  }

  .aba_analises.aberta .conteudo_analises {
    height: calc(100% - 58px);

    padding: 16px 18px 18px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(235px, 320px);

    gap: 16px;

    overflow: hidden;
  }

  /* ÁREA DO GRÁFICO DE ANÁLISE */

  .area_grafico_analise {
    min-width: 0;
    min-height: 0;
    height: 100%;

    display: grid;

    grid-template-rows:
      auto
      minmax(160px, 1fr)
      auto
      auto
      auto;

    gap: 10px;

    position: relative;
  }

  /* HISTOGRAMA */

  .titulo_histograma {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: white;
    margin-top: 2px;
  }

  .subtitulo_histograma {
    text-align: center;
    font-size: 13px;
    opacity: 0.75;
    margin-top: -6px;
  }

  #histograma {
    width: 100%;
    height: 100%;
    min-height: 160px;

    background: black;

    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;

    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.015),
      0 12px 28px rgba(0,0,0,0.18);
  }

  /* CONTROLE DA FAIXA DO HISTOGRAMA */

  .controle_faixa_histograma {
    display: flex;
    flex-direction: column;
    gap: 8px;

    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;

    padding: 12px;
  }

  /* BARRA DA FAIXA DO HISTOGRAMA */

  .barra_faixa_histograma {
    position: relative;
    width: 100%;
    height: 18px;

    background: rgba(255,255,255,0.12);

    border-radius: 20px;

    cursor: pointer;
  }

  /* REGIÃO SELECIONADA DO HISTOGRAMA */

  .faixa_selecionada_histograma {
    position: absolute;

    height: 100%;

    background: rgba(192,132,252,0.45);

    border-radius: 20px;

    left: 0%;
    width: 100%;
  }

  /* ALÇAS DA FAIXA DO HISTOGRAMA */

  .alca_faixa {
    position: absolute;

    top: 50%;

    width: 16px;
    height: 30px;

    background: #c084fc;

    border: 2px solid white;
    border-radius: 8px;

    transform: translate(-50%, -50%);

    cursor: ew-resize;

    z-index: 2;

    box-shadow: 0 0 10px rgba(192,132,252,0.55);
  }

  .alca_faixa.esquerda {
    left: 0%;
  }

  .alca_faixa.direita {
    left: 100%;
  }

  .faixa_histograma {
    text-align: center;
    font-size: 13px;
    opacity: 0.85;
  }

  /* BOTÕES DOS CANAIS RGB */

  .botoes_canais_rgb {
    display: none;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .botao_canal {
    padding: 8px 18px;

    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;

    background: rgba(255,255,255,0.06);

    color: white;

    cursor: pointer;

    font-family: Arial, sans-serif;

    transition: 0.3s;
  }

  .botao_canal:hover {
    background: rgba(192,132,252,0.25);
  }

  .botao_canal.ativo {
    background: rgba(192,132,252,0.45);
    box-shadow: 0 0 10px rgba(192,132,252,0.35);
  }

  /* BOTÕES DE TIPO DE ANÁLISE */

  .botoes_analise_imagem {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* BOTÃO DA ABA DE ANÁLISE */

  .botao_analise {
    padding: 10px 22px;

    border: 1px solid rgba(192,132,252,0.45);
    border-radius: 12px;

    background: rgba(255,255,255,0.06);

    color: white;

    cursor: pointer;

    font-family: Arial, sans-serif;

    transition: 0.3s;
  }

  .botao_analise:hover {
    background: rgba(192,132,252,0.25);
  }

  .botao_analise.ativo {
    background: rgba(192,132,252,0.45);
    box-shadow: 0 0 10px rgba(192,132,252,0.35);
  }

  /* TOOLTIP DO HISTOGRAMA */

  .tooltip_histograma {
    position: fixed;

    display: none;

    background: rgba(10,20,40,0.98);

    color: white;

    border: 1px solid rgba(192,132,252,0.55);
    border-radius: 10px;

    padding: 8px 10px;

    font-size: 12px;

    pointer-events: none;

    z-index: 9999;

    box-shadow: 0 0 12px rgba(0,0,0,0.45);
  }

  /* ÁREA DAS MÉTRICAS */

  .aba_analises.aberta .conteudo_analises > div:last-child {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;

    gap: 8px;
  }

  /* CARDS DE MÉTRICAS */

  .metrica {
    width: 100%;
    max-width: 100%;

    margin-bottom: 0;

    padding: 10px;

    background: rgba(255,255,255,0.055);

    border: 1px solid rgba(255,255,255,0.055);
    border-radius: 10px;

    overflow: hidden;

    box-shadow: inset 0 1px 0 rgba(255,255,255,0.025);
  }

  /* NOME DO ARQUIVO ATUAL */

  #arquivoAtual {
    display: block;

    width: 100%;

    margin-top: 6px;

    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: normal;

    color: #c084fc;

    font-size: 13px;
  }

  /* AJUSTES PARA MONITORES COM MENOR ALTURA */

  @media (max-height: 760px) {

    .aba_analises {
      min-height: clamp(96px, 14vh, 125px);
    }

    .cabecalho_analises {
      min-height: clamp(96px, 14vh, 125px);
      gap: 6px;
      padding: 12px 14px;
    }

    .cabecalho_analises::before {
      width: 36px;
      height: 36px;
      font-size: 21px;
      border-radius: 11px;
    }

    .aba_analises.aberta {
      left: 10px;
      right: 10px;
      top: 10px;
      bottom: 10px;
    }

    .aba_analises.aberta .cabecalho_analises {
      min-height: 50px;
      height: 50px;
    }

    .aba_analises.aberta .conteudo_analises {
      height: calc(100% - 50px);
      padding: 10px 12px 12px;
      gap: 12px;
    }

    .area_grafico_analise {
      grid-template-rows:
        auto
        minmax(125px, 1fr)
        auto
        auto
        auto;

      gap: 7px;
    }

    #histograma {
      min-height: 125px;
    }

    .titulo_histograma {
      font-size: 15px;
    }

    .controle_faixa_histograma {
      padding: 9px;
      gap: 6px;
    }

    .botao_canal,
    .botao_analise {
      padding: 7px 13px;
      font-size: 12px;
    }

    .metrica {
      padding: 7px 9px;
      font-size: 12px;
    }
  }

  /* AJUSTES PARA TELAS MAIS ESTREITAS */

  @media (max-width: 900px) {

    .aba_analises.aberta {
      left: 8px;
      right: 8px;
      top: 8px;
      bottom: 8px;
    }

    .aba_analises.aberta .conteudo_analises {
      grid-template-columns: minmax(0, 1fr) minmax(200px, 245px);
      gap: 10px;
    }

    .metrica {
      font-size: 12px;
      padding: 8px;
    }
  }

</style>

<!-- ABA DE ANÁLISES -->

<div class="aba_analises" id="abaAnalises">

  <!-- CABEÇALHO DA ABA -->

  <div class="cabecalho_analises" id="cabecalhoAnalises">

    <strong>Análises da imagem</strong>

    <span id="iconeAnalises">Abrir</span>

  </div>

  <!-- CONTEÚDO DA ABA -->

  <div class="conteudo_analises">

    <!-- ÁREA DO HISTOGRAMA E CONTROLES -->

    <div class="area_grafico_analise">

      <!-- Título do gráfico -->
      <div class="titulo_histograma" id="tituloHistograma">
        Histograma de Intensidades
      </div>

      <!-- Área onde o histograma será desenhado pelo JavaScript -->
      <canvas id="histograma"></canvas>

      <!-- CONTROLE DE FAIXA DO HISTOGRAMA -->

      <div class="controle_faixa_histograma">

        <!-- Barra onde o usuário arrasta a faixa -->
        <div class="barra_faixa_histograma" id="barraFaixaHistograma">

          <!-- Região roxa selecionada -->
          <div class="faixa_selecionada_histograma" id="faixaSelecionadaHistograma"></div>

          <!-- Alça esquerda da seleção -->
          <div class="alca_faixa esquerda" id="alcaEsquerdaHistograma"></div>

          <!-- Alça direita da seleção -->
          <div class="alca_faixa direita" id="alcaDireitaHistograma"></div>

        </div>

        <!-- Texto mostrando a faixa selecionada -->
        <div class="faixa_histograma" id="faixaHistograma">
          Intensidade de ---
        </div>

      </div>

      <!-- BOTÕES DOS CANAIS RGB -->

      <div class="botoes_canais_rgb" id="botoesCanaisRGB">

        <button class="botao_canal ativo" id="botaoCanalR" onclick="trocarCanalHistograma('r')">
          Vermelho
        </button>

        <button class="botao_canal" id="botaoCanalG" onclick="trocarCanalHistograma('g')">
          Verde
        </button>

        <button class="botao_canal" id="botaoCanalB" onclick="trocarCanalHistograma('b')">
          Azul
        </button>

        <button class="botao_canal" id="botaoCanalMedia" onclick="trocarCanalHistograma('media')">
          Média
        </button>

      </div>

      <!-- BOTÕES DE TIPO DE ANÁLISE -->

      <div class="botoes_analise_imagem">

        <button class="botao_analise ativo" id="botaoHistograma">
          Histograma
        </button>

        <button class="botao_analise" id="botaoMapaPixel">
          Mapa de pixel
        </button>

      </div>

      <!-- TOOLTIP DO HISTOGRAMA -->

      <div class="tooltip_histograma" id="tooltipHistograma"></div>

    </div>

    <!-- ÁREA DAS MÉTRICAS DA IMAGEM -->

    <div>

      <div class="metrica">
        Arquivo atual:
        <span id="arquivoAtual">---</span>
      </div>

      <div class="metrica">
        Tipo da imagem:
        <span id="tipoImagemAtual">---</span>
      </div>

      <div class="metrica">
        Dimensão:
        <span id="dimensaoImagemAtual">---</span>
      </div>

      <div class="metrica">
        Mínimo:
        <span id="minimo">---</span>
      </div>

      <div class="metrica">
        Máximo:
        <span id="maximo">---</span>
      </div>

      <div class="metrica">
        Média:
        <span id="media">---</span>
      </div>

      <div class="metrica">
        Moda:
        <span id="moda">---</span>
      </div>

    </div>

  </div>

</div>
