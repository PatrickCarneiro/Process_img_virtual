<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projetos</title>

  <!-- Fonte usada no sistema -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       RESET GERAL
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Remove a barra de rolagem da página inteira */
    }


    /* =========================================================
       CORPO DA PÁGINA
       ========================================================= */

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0b1d3a, #050c1a);
      color: white;
      width: 100%;
      height: 100vh;
      display: flex;
      overflow: hidden; /* A rolagem fica somente dentro da área de projetos */
    }


    /* =========================================================
       MENU LATERAL
       ========================================================= */

    .menulateral {
      width: 250px;
      height: 100vh;
      min-height: 0;
      background: rgba(10, 20, 40, 0.9);
      padding: 20px;
      border-right: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
      overflow: hidden; /* Mantém a lateral esquerda estática */
    }


    /* =========================================================
       LOGO
       ========================================================= */

    .logo {
      font-size: 25px;
      font-weight: 600;
      margin-bottom: 50px;
    }


    /* =========================================================
       MENU
       ========================================================= */

    .menu {
      list-style: none;
    }

    .menu li {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      transition: 0.3s;
      cursor: pointer;
    }

    .menu li:hover {
      background: rgba(192,132,252,0.15);
      color: #c084fc;
    }

    .menu .active {
      background: rgba(192,132,252,0.2);
      color: #c084fc;
    }


    /* =========================================================
       CONTEÚDO PRINCIPAL
       ========================================================= */

    .main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100vh;
      padding: 40px;
      overflow: hidden; /* Remove a barra da região principal */
      display: flex;
      flex-direction: column;
    }


    /* =========================================================
       CABEÇALHO
       ========================================================= */

    .cabecalho {
      margin-bottom: 35px;
      flex-shrink: 0; /* O cabeçalho não acompanha a rolagem dos projetos */
    }

    .cabecalho h1 {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .cabecalho p {
      opacity: 0.7;
      font-size: 15px;
    }


    /* =========================================================
       CONTROLES DE PESQUISA E ORDENAÇÃO
       ========================================================= */

    .controles_projetos {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .campo_pesquisa_projetos {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .campo_pesquisa_projetos input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 40px;

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 12px;

      background:
        rgba(255,255,255,0.05);

      color: white;

      font-family:
        'Poppins',
        sans-serif;

      font-size: 13px;

      outline: none;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .campo_pesquisa_projetos input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .campo_pesquisa_projetos input:focus {
      border-color:
        rgba(192,132,252,0.65);

      background:
        rgba(192,132,252,0.08);

      box-shadow:
        0 0 0 3px rgba(192,132,252,0.08);
    }

    .icone_pesquisa_projetos {
      position: absolute;

      left: 14px;
      top: 50%;

      transform:
        translateY(-50%);

      pointer-events: none;

      color:
        rgba(255,255,255,0.55);

      font-size: 15px;
    }

    .ordenacao_projetos {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ordenacao_projetos label {
      font-size: 12px;
      opacity: 0.65;
      white-space: nowrap;
    }

    .ordenacao_projetos select {
      height: 42px;
      min-width: 170px;

      padding: 0 34px 0 12px;

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 12px;

      background:
        rgba(255,255,255,0.05);

      color: white;

      font-family:
        'Poppins',
        sans-serif;

      font-size: 12px;

      cursor: pointer;
      outline: none;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .ordenacao_projetos select:hover,
    .ordenacao_projetos select:focus {
      border-color:
        rgba(192,132,252,0.65);

      background:
        rgba(192,132,252,0.08);
    }

    .ordenacao_projetos select option {
      background: #0b1d3a;
      color: white;
    }


    /* =========================================================
       ÁREA DOS PROJETOS
       ========================================================= */

    .area_projetos {
      width: 100%;
      min-height: 0;
      flex: 1;

      overflow-y: auto; /* Somente os projetos possuem rolagem vertical */
      overflow-x: hidden;
      padding-right: 8px;

      scrollbar-gutter: stable;
      overscroll-behavior: contain;

      scrollbar-width: thin; /* Firefox */
      scrollbar-color: rgba(192,132,252,0.65) rgba(255,255,255,0.04);
    }

    /* Barra vertical dos projetos - Chrome, Edge e Safari */
    .area_projetos::-webkit-scrollbar {
      width: 8px;
    }

    .area_projetos::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
    }

    .area_projetos::-webkit-scrollbar-thumb {
      background: linear-gradient(
        180deg,
        rgba(192,132,252,0.72),
        rgba(126,87,194,0.62)
      );
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .area_projetos::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(
        180deg,
        rgba(216,180,254,0.88),
        rgba(192,132,252,0.78)
      );
      background-clip: padding-box;
    }


    /* =========================================================
       GRID DOS PROJETOS
       ========================================================= */

    .grid_projetos {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));

      gap: 20px;

      width: 100%;
    }


    /* =========================================================
       CARD DO PROJETO
       ========================================================= */

    .card_projeto {
      background: rgba(255,255,255,0.05);

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius: 18px;

      overflow: hidden;

      transition: 0.25s ease;

      cursor: pointer;

      min-height: 230px;

      display: flex;
      flex-direction: column;
    }

    .card_projeto:hover {
      background: rgba(192,132,252,0.10);

      border-color:
        rgba(192,132,252,0.45);

      transform: translateY(-4px);

      box-shadow:
        0 12px 30px rgba(0,0,0,0.25);
    }


    /* =========================================================
       PRÉ-VISUALIZAÇÃO DO FLUXO
       ========================================================= */

    .preview_projeto {
      height: 145px;

      background:
        rgba(0,0,0,0.22);

      border-bottom:
        1px solid rgba(255,255,255,0.06);

      position: relative;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    /* Elemento visual que representa o fluxo */

    .preview_fluxo {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      padding: 15px;
    }


    /* Quadrados representando etapas */

    .mini_etapa {
      width: 38px;
      height: 38px;

      border-radius: 8px;

      background:
        rgba(192,132,252,0.22);

      border:
        1px solid rgba(192,132,252,0.45);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 11px;

      color: white;
    }


    /* Linha entre as etapas */

    .mini_linha {
      width: 18px;

      height: 2px;

      background:
        rgba(192,132,252,0.55);
    }


    /* =========================================================
       INFORMAÇÕES DO PROJETO
       ========================================================= */

    .informacoes_projeto {
      padding: 16px;

      flex: 1;
    }

    .nome_projeto {
      font-size: 16px;

      font-weight: 600;

      margin-bottom: 7px;

      word-break: break-word;
    }

    .detalhes_projeto {
      font-size: 12px;

      opacity: 0.55;

      line-height: 1.6;
    }


    /* =========================================================
       RODAPÉ DO CARD
       ========================================================= */

    .acoes_projeto {
      padding: 0 16px 16px 16px;

      display: flex;

      gap: 8px;
    }


    /* =========================================================
       BOTÕES DOS PROJETOS
       ========================================================= */

    .botao_projeto {
      flex: 1;

      padding: 9px 12px;

      border-radius: 9px;

      border:
        1px solid rgba(192,132,252,0.35);

      background:
        rgba(192,132,252,0.18);

      color: white;

      cursor: pointer;

      font-family:
        'Poppins',
        sans-serif;

      font-size: 12px;

      transition: 0.2s;
    }

    .botao_projeto:hover {
      background:
        rgba(192,132,252,0.35);
    }


    /* =========================================================
       ESTADO SEM PROJETOS
       ========================================================= */

    .estado_vazio {
      width: 100%;

      min-height: 320px;

      border:
        2px dashed rgba(255,255,255,0.12);

      border-radius: 20px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 40px;

      background:
        rgba(255,255,255,0.02);
    }


    .estado_vazio_icone {
      width: 70px;
      height: 70px;

      border-radius: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(192,132,252,0.13);

      border:
        1px solid rgba(192,132,252,0.30);

      margin-bottom: 18px;

      font-size: 31px;
    }


    .estado_vazio h2 {
      font-size: 20px;

      margin-bottom: 8px;
    }


    .estado_vazio p {
      opacity: 0.55;

      font-size: 13px;

      max-width: 430px;

      line-height: 1.6;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    #statusProjetos {
      margin-top: 20px;

      font-size: 12px;

      opacity: 0.55;
    }


    /* =========================================================
       RESPONSIVIDADE
       ========================================================= */

    @media (max-width: 900px) {

      body {
        flex-direction: column;
      }

      .menulateral {
        width: 100%;
        height: auto;
        min-height: auto;
        flex-shrink: 0;
      }

      .logo {
        margin-bottom: 20px;
      }

      .menu {
        display: flex;
        gap: 8px;
      }

      .menu li {
        flex: 1;
        text-align: center;
      }

      .main {
        flex: 1;
        height: auto;
        min-height: 0;
        padding: 25px;
      }

      .cabecalho h1 {
        font-size: 36px;
      }

      .controles_projetos {
        flex-direction: column;
        align-items: stretch;
      }

      .ordenacao_projetos {
        width: 100%;
      }

      .ordenacao_projetos select {
        flex: 1;
        min-width: 0;
      }

    }


    @media (max-width: 550px) {

      .grid_projetos {
        grid-template-columns: 1fr;
      }

      .cabecalho h1 {
        font-size: 30px;
      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       MENU LATERAL
       ======================================================= -->

  <div class="menulateral">

    <!-- Nome do sistema -->

    <div class="logo">

      Processamento Imagem Médica

    </div>


    <!-- Menu -->

    <ul class="menu">

      <!-- Volta para página inicial -->

      <li
        onclick="window.location.href='index.html'"
      >
        Início
      </li>


      <!-- Retorna para a última sessão de processamento -->

      <li
        onclick="window.location.href='processamento.html'"
      >
        Processamento
      </li>


      <!-- Página atual -->

      <li class="active">

        Projetos

      </li>

    </ul>

  </div>



  <!-- =======================================================
       ÁREA PRINCIPAL
       ======================================================= -->

  <main class="main">


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <div class="cabecalho">

      <h1>Projetos</h1>

      <p>
        Acesse os fluxos de processamento que você salvou.
      </p>

    </div>



    <!-- =====================================================
         PESQUISA E ORDENAÇÃO DOS PROJETOS
         ===================================================== -->

    <div class="controles_projetos">

      <!-- Campo para pesquisar projeto pelo nome -->
      <div class="campo_pesquisa_projetos">

        <span class="icone_pesquisa_projetos">⌕</span>

        <input
          type="text"
          id="campoPesquisaProjetos"
          placeholder="Pesquisar projeto pelo nome..."
          autocomplete="off"
        >

      </div>


      <!-- Seletor de ordenação -->
      <div class="ordenacao_projetos">

        <label for="ordenacaoProjetos">
          Ordenar por:
        </label>

        <select id="ordenacaoProjetos">

          <option value="recentes">
            Mais recentes
          </option>

          <option value="antigos">
            Mais antigos
          </option>

          <option value="az">
            Nome: A → Z
          </option>

          <option value="za">
            Nome: Z → A
          </option>

        </select>

      </div>

    </div>



    <!-- =====================================================
         ÁREA DOS PROJETOS
         ===================================================== -->

    <section class="area_projetos">


      <!-- ===================================================
           MENSAGEM QUANDO NÃO EXISTIR NENHUM PROJETO
           =================================================== -->

      <div
        id="estadoVazioProjetos"
        class="estado_vazio"
      >

        <div class="estado_vazio_icone">

          ◇

        </div>


        <h2>

          Nenhum projeto salvo

        </h2>


        <p>

          Quando você montar um fluxo de processamento
          e utilizar a opção "Salvar fluxo",
          ele aparecerá aqui.

        </p>

      </div>



      <!-- ===================================================
           PROJETOS SALVOS

           O projeto.js irá inserir os cards aqui.
           =================================================== -->

      <div
        id="listaProjetos"
        class="grid_projetos"
        style="display: none;"
      >

      </div>



      <!-- Status utilizado pelo JavaScript -->

      <p id="statusProjetos"></p>


    </section>


  </main>



  <!-- =======================================================
       JAVASCRIPT DA PÁGINA DE PROJETOS
       ======================================================= -->

  <script src="projeto.js"></script>


</body>

</html>
